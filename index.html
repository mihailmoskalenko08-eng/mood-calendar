  <script>
    // Тема до отрисовки — без вспышки светлого экрана ночью
    try {
      var d = JSON.parse(localStorage.getItem('ottenki:data:v1') || 'null')
      var t = (d && d.settings && d.settings.theme) || localStorage.getItem('ottenki:theme')
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
    } catch (e) {}
    // Строка состояния iPhone: на тёмном фоне — прозрачная со светлым текстом, на светлом — обычная с тёмным
    try {
      var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
      if (dark) document.getElementById('status-bar').setAttribute('content', 'black-translucent')
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>Для «Оттенков» нужен включённый JavaScript.</noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
